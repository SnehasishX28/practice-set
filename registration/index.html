<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        /* Normal CSS - Simple and Clean */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .form-container {
            background-color: white;
            width: 350px;
            margin: 0 auto; /* Centers the box */
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .form-title {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        /* TARGETING BY CLASS as requested */
        .text-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px; /* Space between fields */
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Keeps padding inside */
        }

        .gender-wrapper {
            margin-bottom: 15px;
        }

        .radio-input {
            margin-right: 5px;
        }

        .date-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #218838; /* Darker Green on hover */
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Student Registration</h2>

        <form>
            <label for="name" class="input-label">Name</label>
            <input type="text" id="name" class="text-input" placeholder="Enter full name" required>

            <label for="email" class="input-label">Email</label>
            <input type="email" id="email" class="text-input" placeholder="Enter email address" required>

            <label for="password" class="input-label">Password</label>
            <input type="password" id="password" class="text-input" placeholder="Create a password" required>

            <label class="input-label">Gender</label>
            <div class="gender-wrapper">
                <input type="radio" id="male" name="gender" value="male" class="radio-input">
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="female" class="radio-input">
                <label for="female">Female</label>
            </div>

            <label for="dob" class="input-label">Date of Birth</label>
            <input type="date" id="dob" class="date-input" required>

            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>

</body>
</html>
